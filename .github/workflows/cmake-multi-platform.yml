name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}


    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc]
        include:
          - os: windows-latest
            c_compiler: gcc
            cpp_compiler: g++
            generator_name: "MinGW Makefiles"
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            generator_name: "Unix Makefiles"

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set build directory
      id: vars
      shell: bash
      run: |
        echo "BUILD_DIR=${{ github.workspace }}/build" >> $GITHUB_ENV

    - name: Cache build directory
      uses: actions/cache@v4
      id: cache-build
      with:
        path: ${{ env.BUILD_DIR }}
        key: ${{ runner.os }}-cmake-build-${{ hashFiles('**/CMakeLists.txt') }}-${{ matrix.build_type }}
        restore-keys: |
          ${{ runner.os }}-cmake-build-

    - name: Cache submodules
      uses: actions/cache@v4
      id: cache-submodules
      with:
        path: .git/modules
        key: ${{ runner.os }}-submodules-${{ hashFiles('.gitmodules') }}

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install build-essential git make pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.4.309.0
        cache: true

    - name: Configure CMake
      run: >
        cmake -B ${{ env.BUILD_DIR }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -G "${{ matrix.generator_name }}"
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ env.BUILD_DIR }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ env.BUILD_DIR }}
      run: ctest --build-config ${{ matrix.build_type }}

    - name: Upload Release Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-release-build
        path: ${{ env.BUILD_DIR }}/
        if-no-files-found: error
